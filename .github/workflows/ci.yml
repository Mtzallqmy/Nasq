name: bootstrap-lockfile

on:
  pull_request:

permissions:
  contents: write

jobs:
  commit-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile to Phase 0 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git commit -m "chore: commit deterministic npm lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
