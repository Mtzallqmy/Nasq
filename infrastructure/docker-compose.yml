services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nasq}
      POSTGRES_USER: ${POSTGRES_USER:-nasq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nasq_dev_password}
      TZ: UTC
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nasq} -d ${POSTGRES_DB:-nasq}']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - nasq_postgres_data:/var/lib/postgresql/data

volumes:
  nasq_postgres_data:
